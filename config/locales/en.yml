# Attribute names and error messages for the Wheelhouse models, worded for the
# person at the counter rather than for a developer.

en:
  helpers:
    submit:
      create: "Add %{model}"
      update: "Save changes"
  activerecord:
    models:
      repair_line_item:
        one: "line item"
        other: "line items"
      employee:
        one: "Staff member"
        other: "Staff"
    attributes:
      bike:
        customer: "Owner"
        customer_id: "Owner"
        serial_number: "Serial number"
      repair:
        bike: "Bike"
        bike_id: "Bike"
        mechanic: "Mechanic"
        mechanic_id: "Mechanic"
        status: "State"
        reported_problem: "Reported problem"
        promised_on: "Promised day"
        handed_back_at: "Hand-back time"
        intake_photos: "Intake photos"
        diagnosis: "Diagnosis"
      repair_line_item:
        repair: "Repair"
        service: "Service"
        service_id: "Service"
        charged_price: "Charged price"
      repair/repair_line_items:
        repair: "Repair"
        service: "Service"
        charged_price: "Charged price"
      payment:
        repair: "Repair"
        method: "Payment method"
        paid_at: "Payment date"
    errors:
      messages:
        required: "must be chosen"
        greater_than: "must be more than %{count}"
      models:
        customer:
          restrict_dependent_destroy:
            has_many: "This customer still has bikes on file, so they can't be deleted."
        bike:
          attributes:
            serial_number:
              taken: "is already registered to another bike"
          restrict_dependent_destroy:
            has_many: "This bike has repairs on file, so it can't be deleted."
        service:
          attributes:
            name:
              taken: "is already on the price list"
          restrict_dependent_destroy:
            has_many: "This service has been charged on a repair, so it can't be deleted."
        repair:
          attributes:
            intake_photos:
              not_a_photo: "can only be JPEG, PNG or WebP images, and “%{filename}” isn't one"
              too_large: "can be at most %{limit} each, and “%{filename}” is %{size}"
          restrict_dependent_destroy:
            has_many: "This repair has payments recorded, so it can't be deleted."
