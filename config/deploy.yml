# Kamal 2 deployment of Wheelhouse. See docs/deployment.md.
#
# Two values come from the laptop's environment, so the file works for any droplet
# and any registry account without editing it:
#
#   export WHEELHOUSE_HOST=203.0.113.10          # the droplet's IP
#   export KAMAL_REGISTRY_USERNAME=your-user     # Docker Hub user
#
# The secrets (registry token, database password, production master key) are read
# by .kamal/secrets, which holds no values.

service: webtech_wheelhouse

image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>/webtech-wheelhouse

servers:
  web:
    - <%= ENV.fetch("WHEELHOUSE_HOST") %>

# kamal-proxy answers on port 80 for any Host, over plain HTTP: there is no domain,
# so there is no certificate (ssl: false, and assume_ssl/force_ssl stay off in
# config/environments/production.rb). Thruster listens on 80 inside the container.
proxy:
  ssl: false
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

# Docker Hub (the default server). The password is an access token, not the
# account's password.
registry:
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - WEBTECH_WHEELHOUSE_DATABASE_PASSWORD
  clear:
    # Solid Queue's supervisor runs inside Puma: one container serves pages and runs jobs.
    SOLID_QUEUE_IN_PUMA: true
    # The PostgreSQL accessory below, by its container name on Kamal's Docker network.
    DB_HOST: webtech_wheelhouse-db
    # The address the app answers at: Host check and links in emails.
    APP_HOST: <%= ENV.fetch("WHEELHOUSE_HOST") %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# The intake photos (Active Storage's Disk service, /rails/storage) live in a Docker
# volume on the droplet's disk, so they outlive every container.
volumes:
  - "webtech_wheelhouse_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

# Built on the laptop (x86_64), which is the droplet's architecture: no emulation.
builder:
  arch: amd64

accessories:
  db:
    image: postgres:18
    host: <%= ENV.fetch("WHEELHOUSE_HOST") %>
    # No "port:" on purpose: the database publishes no port, not even on the
    # droplet's own interfaces. The app reaches it over Kamal's Docker network.
    env:
      clear:
        POSTGRES_USER: webtech_wheelhouse
        POSTGRES_DB: webtech_wheelhouse_production
      secret:
        - POSTGRES_PASSWORD
    # The rows live in ~/webtech_wheelhouse-db/data on the droplet, outside the container.
    directories:
      - data:/var/lib/postgresql
